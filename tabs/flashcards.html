<div class="flashcards-wrapper fade-in">
    <h2 class="tab-title">Flashcards 💡</h2>
    <p class="tab-desc">Practice vocabulary and phrases. Flip cards to see translations!</p>

    <!-- FLASHCARD DISPLAY -->
    <div class="flashcard-container">
        <div class="flashcard" id="flashcard">
            <div class="front">Hola</div>
            <div class="back">Hello</div>
        </div>
    </div>

    <!-- CONTROLS -->
    <div class="flashcard-controls">
        <button id="prevCard">Previous</button>
        <button id="flipCard">Flip</button>
        <button id="nextCard">Next</button>
        <button id="deleteCardBtn">Delete</button>
    </div>

    <!-- ADD FLASHCARD -->
    <div class="flashcard-add">
        <input type="text" id="flashcardFront" placeholder="Front">
        <input type="text" id="flashcardBack" placeholder="Back">
        <button id="addCardBtn">Add Flashcard</button>
    </div>

    <div id="flashcardList" class="flashcard-list">
        <!-- LIST OF ALL FLASHCARDS GO HERE-->
    </div>

</div>
