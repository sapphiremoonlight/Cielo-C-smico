<!-- ===================== CONJUGATION HELPER ===================== -->
<div id="conjugation-tab" class="tab fade-in">
    <div class="card">
        <h2>Conjugation Helper ✨</h2>
        <p>Search a Spanish verb and see its tenses instantly.</p>

        <div class="search-container">
            <input type="text" id="verbSearch" placeholder="Enter a verb..." />
            <button id="searchBtn">Search</button>
        </div>

        <div id="verbResult">
            <p class="placeholder">Verb info will appear here.</p>
        </div>

        <!-- Optional YouTube videos for pronunciation -->
        <h3>Examples / Pronunciation</h3>
        <div id="youtubeVideos"></div>
    </div>
</div>
