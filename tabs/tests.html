<!-- Test Creation Section -->
<div id="test-creation">
    <h1>Create a New Test</h1>

    <div class="input-group">
        <label for="test-title">Test Title</label>
        <input type="text" id="test-title" placeholder="Enter test title">
    </div>

    <div class="input-group">
        <label for="test-subtitle">Subtitle (Optional)</label>
        <input type="text" id="test-subtitle" placeholder="Enter a subtitle">
    </div>

   <div class="input-group">
    <label for="question-count">Number of Questions</label>
    <select id="question-count">
        <option value="" disabled selected>Number of Questions</option> <!-- placeholder -->
        <option value="5">5</option>
        <option value="10">10</option>
        <option value="15">15</option>
        <option value="20">20</option>
        <option value="25">25</option>
        <option value="30">30</option>
    </select>
</div>

    <div class="input-group">
        <label for="test-type">Test Type</label>
        <select id="test-type">
            <option value="multiple-choice">Multiple Choice</option>
            <option value="matching">Match Word with Definition</option>
            <option value="written">Written Test</option>
        </select>
    </div>

    <div class="input-group">
        <label for="test-timer">Set Timer (Minutes)</label>
        <input type="number" id="test-timer" min="1" max="60" placeholder="Minutes">
    </div>

    <div id="question-list"></div>

    <div class="action-buttons">
        <button id="create-test-btn">Create Test</button>
    </div>
</div>

<!-- Test List Section -->
<div id="test-list">
    <h1>All Tests</h1>

    <div class="search-sort">
        <input type="text" id="search-tests" placeholder="Search tests...">

        <select id="sort-options">
            <option value="date-desc">Newest First</option>
            <option value="date-asc">Oldest First</option>
            <option value="alpha-asc">A-Z</option>
            <option value="alpha-desc">Z-A</option>
            <option value="type">By Type</option>
        </select>
    </div>

    <!-- FIX: separate container so we don’t delete the header -->
    <div id="test-list-container"></div>
</div>
