<div class="weekly-wrapper fade-in">
    <h2 class="tab-title">Weekly Learning Plan ✧</h2>
    <p class="tab-desc">Mark tasks as complete — your progress is saved automatically.</p>

    <!-- PROGRESS BAR -->
    <div class="weekly-progress">
        <div id="weeklyProgressFill"></div>
    </div>
    <p class="progress-label"><span id="weeklyProgressText">0%</span> complete this week</p>

    <!-- WEEKLY GRID -->
    <div class="weekly-grid">

        <!-- Monday -->
        <div class="day-card" data-day="monday">
            <h3>Monday</h3>
            <p class="day-sub">Vocabulary + Verbs</p>
            <label><input type="checkbox" class="weekly-task" data-id="mon1"> Review core verbs</label>
            <label><input type="checkbox" class="weekly-task" data-id="mon2"> Write 6+ sentences</label>
            <label><input type="checkbox" class="weekly-task" data-id="mon3"> Mini quiz</label>
        </div>

        <!-- Tuesday -->
        <div class="day-card" data-day="tuesday">
            <h3>Tuesday</h3>
            <p class="day-sub">Music Analysis</p>
            <label><input type="checkbox" class="weekly-task" data-id="tue1"> Listen to 1 Spanish song</label>
            <label><input type="checkbox" class="weekly-task" data-id="tue2"> Fill song analysis sheet</label>
        </div>

        <!-- Wednesday -->
        <div class="day-card" data-day="wednesday">
            <h3>Wednesday</h3>
            <p class="day-sub">Reading (Your Novella)</p>
            <label><input type="checkbox" class="weekly-task" data-id="wed1"> Read a chapter</label>
            <label><input type="checkbox" class="weekly-task" data-id="wed2"> Look up vocab</label>
            <label><input type="checkbox" class="weekly-task" data-id="wed3"> Answer questions</label>
        </div>

        <!-- Thursday -->
        <div class="day-card" data-day="thursday">
            <h3>Thursday</h3>
            <p class="day-sub">Grammar Bite</p>
            <label><input type="checkbox" class="weekly-task" data-id="thu1"> Study weekly grammar</label>
            <label><input type="checkbox" class="weekly-task" data-id="thu2"> Write practice sentences</label>
        </div>

        <!-- Friday -->
        <div class="day-card" data-day="friday">
            <h3>Friday</h3>
            <p class="day-sub">Writing</p>
            <label><input type="checkbox" class="weekly-task" data-id="fri1"> Journal or mini story</label>
            <label><input type="checkbox" class="weekly-task" data-id="fri2"> Review/refine writing</label>
        </div>

        <!-- Saturday -->
        <div class="day-card" data-day="saturday">
            <h3>Saturday</h3>
            <p class="day-sub">Mixed Review</p>
            <label><input type="checkbox" class="weekly-task" data-id="sat1"> Vocab review</label>
            <label><input type="checkbox" class="weekly-task" data-id="sat2"> Short listening practice</label>
            <label><input type="checkbox" class="weekly-task" data-id="sat3"> Grammar refresh</label>
        </div>

        <!-- Sunday -->
        <div class="day-card" data-day="sunday">
            <h3>Sunday</h3>
            <p class="day-sub">Light Day 💚</p>
            <label><input type="checkbox" class="weekly-task" data-id="sun1"> Light review</label>
        </div>

    </div>
</div>
