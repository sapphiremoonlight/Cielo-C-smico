<!-- ===================== GAMIFICATION ===================== -->
<div id="gamification-tab" class="tab fade-in">
    <div class="card">
        <h2>Gamification 🎮</h2>
        <p>Earn XP, level up, and test your knowledge with quizzes!</p>

        <!-- XP & Levels -->
        <div id="xp-level-container">
            <h3>Player Stats</h3>
            <p>Level: <span id="player-level">1</span></p>
            <p>XP: <span id="player-xp">0</span> / <span id="xp-needed">100</span></p>
            <div class="xp-bar">
                <div class="xp-fill" style="width: 0%;"></div>
            </div>
            <button id="gainXpBtn">Gain XP</button>
        </div>

        <!-- Quiz Generator -->
        <div id="quiz-container">
            <h3>Quick Quiz</h3>
            <p id="quiz-question">Press "Next Question" to start!</p>
            <div id="quiz-options"></div>
            <button id="next-question-btn">Next Question</button>
            <p id="quiz-feedback"></p>
        </div>
    </div>
</div>
